databaseChangeLog:
  - changeSet:
      id: 0001-init-easy-ai-tables
      author: easy-ai
      preconditions:
        # Databases that already hold these tables (e.g. legacy projects) skip creation.
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: ai_chat_session_task
      changes:
        - createTable:
            tableName: ai_chat_session_task
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: INT
              - column:
                  name: field_list
                  type: TEXT
              - column:
                  name: records
                  type: TEXT
              - column:
                  name: extra_content
                  type: TEXT
              - column:
                  name: status
                  type: INT
              - column:
                  name: scenario_code
                  type: INT
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: create_by
                  type: BIGINT
              - column:
                  name: update_by
                  type: BIGINT
              - column:
                  name: create_time
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: update_time
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueNumeric: 0
  - changeSet:
      id: 0002-add-ai-task-engine-tables
      author: easy-ai
      preconditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: ai_task_config
      changes:
        - createTable:
            tableName: ai_task_config
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: task_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: config_json
                  type: LONGTEXT
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: 'DRAFT'
                  constraints:
                    nullable: false
              - column:
                  name: published_time
                  type: DATETIME
              - column:
                  name: create_by
                  type: BIGINT
              - column:
                  name: update_by
                  type: BIGINT
              - column:
                  name: create_time
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: update_time
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueNumeric: 0
        - addUniqueConstraint:
            tableName: ai_task_config
            columnNames: task_type, version
            constraintName: uk_task_type_version
  - changeSet:
      id: 0003-add-engine-fields-to-task
      author: easy-ai
      preconditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: ai_chat_session_task
            columnName: task_type
      changes:
        - addColumn:
            tableName: ai_chat_session_task
            columns:
              - column:
                  name: task_type
                  type: VARCHAR(100)
                  afterColumn: scenario_code
              - column:
                  name: config_version
                  type: INT
                  afterColumn: task_type
  - changeSet:
      id: 0004-add-ai-task-state-column
      author: easy-ai
      preconditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: ai_chat_session_task
            columnName: ai_task_state
      changes:
        - addColumn:
            tableName: ai_chat_session_task
            columns:
              - column:
                  name: ai_task_state
                  type: LONGTEXT
                  afterColumn: config_version
  - changeSet:
      id: 0005-add-version-to-task-table
      author: easy-ai
      comment: 乐观锁 version 字段，用于并发安全
      preconditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: ai_chat_session_task
            columnName: version
      changes:
        - addColumn:
            tableName: ai_chat_session_task
            columns:
              - column:
                  name: version
                  type: INT
                  defaultValueNumeric: 0
                  afterColumn: ai_task_state
  - changeSet:
      id: 0006-create-ai-chat-session-table
      author: easy-ai
      comment: 会话状态表，维护 sessionId 与当前活跃任务的绑定关系，支持多轮对话连续性与任务切换
      preconditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: ai_chat_session
      changes:
        - createTable:
            tableName: ai_chat_session
            remarks: AI 会话状态表（sessionId 与活跃任务绑定）
            columns:
              - column:
                  name: session_id
                  type: VARCHAR(128)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: current_task_id
                  type: VARCHAR(64)
                  remarks: 当前活跃任务 ID，NULL 表示无活跃任务
              - column:
                  name: current_task_type
                  type: VARCHAR(100)
                  remarks: 当前任务类型，冗余便于查询
              - column:
                  name: status
                  type: TINYINT
                  defaultValueNumeric: 0
                  remarks: 0-IDLE, 1-ACTIVE, 2-EXPIRED
              - column:
                  name: last_active_time
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: 最后活跃时间，用于超时判断
              - column:
                  name: turn_count
                  type: INT
                  defaultValueNumeric: 0
                  remarks: 当前任务已进行轮次
              - column:
                  name: tenant_id
                  type: BIGINT
                  defaultValueNumeric: 0
              - column:
                  name: create_time
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: update_time
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createIndex:
            tableName: ai_chat_session
            indexName: idx_ai_chat_session_task_id
            columns:
              - column:
                  name: current_task_id
  - changeSet:
      id: 0007-add-task-id-to-session-task
      author: easy-ai
      comment: 增加 task_id 业务键字段，支持任意字符串格式的 taskId，替代用自增 id 作为 taskId 的脆弱设计
      preconditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: ai_chat_session_task
            columnName: task_id
      changes:
        - addColumn:
            tableName: ai_chat_session_task
            columns:
              - column:
                  name: task_id
                  type: VARCHAR(128)
                  afterColumn: id
        - createIndex:
            tableName: ai_chat_session_task
            indexName: uk_task_id
            unique: true
            columns:
              - column:
                  name: task_id
  - changeSet:
      id: 0008-create-task-lock-table
      author: easy-ai
      comment: 分布式锁表，防止同一session并发请求导致状态错乱
      preconditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: ai_task_lock
      changes:
        - createTable:
            tableName: ai_task_lock
            remarks: AI任务分布式锁表
            columns:
              - column:
                  name: lock_key
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: lock_owner
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: lock_time
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: expire_time
                  type: DATETIME
                  constraints:
                    nullable: false
        - createIndex:
            tableName: ai_task_lock
            indexName: idx_lock_expire
            columns:
              - column:
                  name: expire_time
  - changeSet:
      id: 0009-add-chat-history-to-session
      author: easy-ai
      comment: 为会话表增加对话历史字段，支持滑动窗口多轮上下文理解
      preconditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: ai_chat_session
            columnName: chat_history
      changes:
        - addColumn:
            tableName: ai_chat_session
            columns:
              - column:
                  name: chat_history
                  type: LONGTEXT
                  remarks: 对话历史JSON数组（滑动窗口，已废弃，迁移至 ai_chat_message 表）
  - changeSet:
      id: 0010-create-chat-message-table
      author: easy-ai
      comment: 独立对话消息表，替代 ai_chat_session.chat_history JSON 字段，支持历史查询与分页
      preconditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: ai_chat_message
      changes:
        - createTable:
            tableName: ai_chat_message
            remarks: AI对话消息表
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_id
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(32)
                  remarks: 消息角色：user / assistant / system
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: LONGTEXT
                  remarks: 消息内容
              - column:
                  name: task_id
                  type: VARCHAR(128)
                  remarks: 关联的任务ID（可选）
              - column:
                  name: task_type
                  type: VARCHAR(128)
                  remarks: 任务类型（可选，冗余便于查询）
              - column:
                  name: turn_index
                  type: INT
                  remarks: 轮次索引，同一session内递增
                  defaultValueNumeric: 0
              - column:
                  name: tenant_id
                  type: BIGINT
                  remarks: 租户ID
              - column:
                  name: create_time
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: update_time
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueNumeric: 0
        - createIndex:
            tableName: ai_chat_message
            indexName: idx_session_id
            columns:
              - column:
                  name: session_id
              - column:
                  name: create_time
        - createIndex:
            tableName: ai_chat_message
            indexName: idx_task_id
            columns:
              - column:
                  name: task_id
  - changeSet:
      id: 0011-add-intent-fields-to-task
      author: easy-ai
      comment: 增加意图识别字段，记录任务创建时的意图判断理由、置信度和匹配来源，方便调试提示词
      preconditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: ai_chat_session_task
            columnName: intent_reason
      changes:
        - addColumn:
            tableName: ai_chat_session_task
            columns:
              - column:
                  name: intent_reason
                  type: TEXT
                  remarks: 意图识别判断理由
                  afterColumn: ai_task_state
              - column:
                  name: intent_confidence
                  type: DOUBLE
                  remarks: 意图识别置信度 0.0-1.0
                  afterColumn: intent_reason
              - column:
                  name: intent_source
                  type: VARCHAR(32)
                  remarks: 匹配来源：LLM / KEYWORD / FALLBACK / CONTINUE
                  afterColumn: intent_confidence
  - changeSet:
      id: 0012-tenant-id-to-varchar
      author: easy-ai
      comment: 将三张表的 tenant_id 从 BIGINT 改为 VARCHAR(64)，支持数字或字符串编码的租户 ID（多租户多用户场景）
      preconditions:
        onFail: MARK_RAN
        not:
          dbms:
            type: h2
      changes:
        - modifyDataType:
            tableName: ai_chat_session_task
            columnName: tenant_id
            newDataType: VARCHAR(64)
        - modifyDataType:
            tableName: ai_chat_session
            columnName: tenant_id
            newDataType: VARCHAR(64)
        - modifyDataType:
            tableName: ai_chat_message
            columnName: tenant_id
            newDataType: VARCHAR(64)
  - changeSet:
      id: 0013-session-composite-key
      author: easy-ai
      comment: 会话表改为自增 id 主键 + (tenant_id, session_id) 唯一约束，支持同一 sessionId 在不同租户下各自独立（多租户多用户隔离）
      preconditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: ai_chat_session
            columnName: id
      changes:
        # MySQL 不允许在已有主键的表上直接添加自增主键列：
        # 1) 先移除 session_id 旧主键（不删数据，仅去约束）
        # 2) 再添加 id 自增主键列
        - sql:
            dbms: mysql
            sql: >-
              ALTER TABLE ai_chat_session DROP PRIMARY KEY;
              ALTER TABLE ai_chat_session ADD COLUMN id BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY FIRST;
        - addUniqueConstraint:
            tableName: ai_chat_session
            columnNames: tenant_id, session_id
            constraintName: uk_tenant_session
        - createIndex:
            tableName: ai_chat_message
            indexName: idx_tenant_session
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: session_id
